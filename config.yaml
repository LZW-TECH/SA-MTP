
d_fea: 40  
max_len: 50

# ESM-2配置
use_esm2: true  
esm_dim: 1280  
esm_cache_path: features/esm2_embeddings.pkl  

use_gat: true 
beta: 4.0  
lambda_weight: 0.25  
top_k: null  
ss2_dir: texture  

graph_type: dynamic

use_learnable_lambda: true  
lambda_init: 0.25  
use_dropedge: true  
dropedge_rate: 0.1  

use_film: true  
film_stable_mode: true  
film_alpha: 0.2  
film_dropout: 0.2  
lambda_film: 1e-4  
film_warmup_epochs: 3  

projection_hidden: 512  
projection_dropout: 0.1  

use_optimal_thresholds: true  
threshold_metric: 'f1'  

threshold_strategy:
  AMP: 'f1'
  TXP: 'mcc'
  ABP: 'mcc'
  AIP: 'mcc'
  AVP: 'mcc'
  ACP: 'f1'
  AFP: 'f1'
  DDV: 'mcc'
  CPP: 'fixed'
  CCC: 'f1'
  APP: 'fixed'
  AAP: 'f1'
  AHTP: 'fixed'
  PBP: 'fixed'
  QSP: 'fixed'

pts:
  - AMP.txt
  - TXP.txt
  - ABP.txt
  - AIP.txt
  - AVP.txt
  - ACP.txt
  - AFP.txt
  - DDV.txt
  - CPP.txt
  - CCC.txt
  - APP.txt
  - AAP.txt
  - AHTP.txt
  - PBP.txt
  - QSP.txt


